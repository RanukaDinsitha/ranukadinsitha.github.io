<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranuka</title>
  
    <link rel="icon" type="image/x-icon" href="https://github.com/RanukaDinsitha/Quickly/raw/refs/heads/main/person">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">  
  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/3.9.1/tsparticles.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --gloss-highlight: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
            color: var(--text-main);
            font-family: "Inter", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        #tsparticles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; 
        }

        main {
            position: relative;
            z-index: 2; 
            text-align: center;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            
            /* Glossy Glassmorphism Effect */
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            
            /* Glossy Shine Overlay */
            overflow: hidden;
        }

        /* Diagonal Shine Reflection */
        main::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.03) 50%,
                transparent 55%
            );
            pointer-events: none;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 1rem;
            letter-spacing: -0.04em;
            /* Subtle glow for glossy look */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        h3 {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.6;
            letter-spacing: -0.01em;
        }

        h1::after {
            content: "_";
            display: inline-block;
            margin-left: 2px;
            animation: blink 1s infinite;
            color: #fff;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Clean selection color */
        ::selection {
            background: rgba(255, 255, 255, 0.99);
            color: #000;
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <main>
        <h1>Hello, welcome!</h1>
        <h3>Nice to meet you! My name is <b>Ranuka Dinsitha</b> and this is my digital space.</h3>
    </main>

    <script>
        tsParticles.load("tsparticles", {
            fpsLimit: 60,
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: {
                    value: 0.2,
                    random: true,
                    anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
                },
                size: {
                    value: 2,
                    random: true
                },
                links: {
                    enable: true,
                    distance: 150,
                    color: "#ffffff",
                    opacity: 0.1,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 0.8,
                    direction: "none",
                    random: false,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onHover: { enable: true, mode: "grab" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 200, links: { opacity: 0.4 } }
                }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
