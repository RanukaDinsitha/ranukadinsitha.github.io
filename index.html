<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranuka</title>
  
    <link rel="icon" type="image/x-icon" href="https://github.com/RanukaDinsitha/Quickly/raw/refs/heads/main/person">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">  
  
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.1.0/tsparticles.bundle.min.js"></script>
    
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --muted: #999999;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            color: var(--text);
            font-family: "Inter", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        #tsparticles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; 
        }

        main {
            position: relative;
            z-index: 10; 
            text-align: center;
            padding: 3.5rem;
            max-width: 460px;
            width: 85%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        main::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -0.06em;
            background: linear-gradient(180deg, #FFFFFF 0%, #AAAAAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h3 {
            font-size: 1.05rem;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.6;
            margin: 0;
            letter-spacing: -0.02em;
        }

        b {
            color: #fff;
            font-weight: 600;
        }

        h1::after {
            content: "_";
            display: inline-block;
            margin-left: 4px;
            animation: blink 1.2s infinite;
            -webkit-text-fill-color: #fff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        ::selection {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <main>
        <h1>Hello, welcome!</h1>
        <h3>Nice to meet you! My name is <b>Ranuka Dinsitha</b> and this is my digital space.</h3>
    </main>

    <script>
        tsParticles.load("tsparticles", {
            fpsLimit: 120,
            particles: {
                number: {
                    value: 80,
                    density: { enable: true, area: 800 }
                },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: {
                    value: 0.4,
                    random: true,
                    animation: {
                        enable: true,
                        speed: 1,
                        minimumValue: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: { min: 1, max: 2.5 }
                },
                links: {
                    enable: true,
                    distance: 150,
                    color: "#ffffff",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.2,
                    direction: "none",
                    outModes: { default: "out" }
                }
            },
            interactivity: {
                events: {
                    onHover: {
                        enable: true,
                        mode: "grab"
                    }
                },
                modes: {
                    grab: {
                        distance: 200,
                        links: { opacity: 0.5 }
                    }
                }
            },
            detectRetina: true
        });
    </script>
</body>
</html>
