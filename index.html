<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranuka</title>
  
    <link rel="icon" type="image/x-icon" href="https://github.com/RanukaDinsitha/Quickly/raw/refs/heads/main/person">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">  
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.185.1/three.tsl.js" integrity="sha512-kZQ7qvdu/LZttfY56Jrvu7YiXUo/b04XLStBwKqzKuCF8hwdZ4yuesvKx6tqGkVXHGU9w3MRO86VfJ0MfVShNw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --muted: #999999;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            color: var(--text);
            font-family: "Inter", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; 
        }

        main {
            position: relative;
            z-index: 10; 
            text-align: center;
            padding: 3.5rem;
            max-width: 460px;
            width: 85%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        main::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -0.06em;
            background: linear-gradient(180deg, #FFFFFF 0%, #AAAAAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h3 {
            font-size: 1.05rem;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.6;
            margin: 0;
            letter-spacing: -0.02em;
        }

        b {
            color: #fff;
            font-weight: 600;
        }

        h1::after {
            content: "_";
            display: inline-block;
            margin-left: 4px;
            animation: blink 1.2s infinite;
            -webkit-text-fill-color: #fff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        ::selection {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <main>
        <h1>Hello, welcome!</h1>
        <h3>Nice to meet you! My name is <b>Ranuka Dinsitha</b> and this is my digital space.</h3>
    </main>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const particleCount = 80;
        const particlesData = [];
        const positions = new Float32Array(particleCount * 3);
        const particlesGeometry = new THREE.BufferGeometry();
        
        const maxDistance = 150;
        const mouseDistance = 200;
        const moveSpeed = 0.5;
        let mouse = new THREE.Vector2(-1000, -1000);

        for (let i = 0; i < particleCount; i++) {
            const x = Math.random() * window.innerWidth - window.innerWidth / 2;
            const y = Math.random() * window.innerHeight - window.innerHeight / 2;
            const z = Math.random() * 200 - 100;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            particlesData.push({
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * moveSpeed,
                    (Math.random() - 0.5) * moveSpeed,
                    0
                )
            });
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 2.5,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true
        });

        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        const lineGeometry = new THREE.BufferGeometry();
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.2
        });
        const lineMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lineMesh);

        camera.position.z = 400;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX - window.innerWidth / 2);
            mouse.y = -(event.clientY - window.innerHeight / 2);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            const posArray = particlesGeometry.attributes.position.array;
            const linePositions = [];
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                posArray[i3] += particlesData[i].velocity.x;
                posArray[i3 + 1] += particlesData[i].velocity.y;

                if (posArray[i3] < -window.innerWidth / 2 || posArray[i3] > window.innerWidth / 2) particlesData[i].velocity.x *= -1;
                if (posArray[i3 + 1] < -window.innerHeight / 2 || posArray[i3 + 1] > window.innerHeight / 2) particlesData[i].velocity.y *= -1;

                for (let j = i + 1; j < particleCount; j++) {
                    const j3 = j * 3;
                    const dx = posArray[i3] - posArray[j3];
                    const dy = posArray[i3 + 1] - posArray[j3 + 1];
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        linePositions.push(posArray[i3], posArray[i3 + 1], posArray[i3 + 2]);
                        linePositions.push(posArray[j3], posArray[j3 + 1], posArray[j3 + 2]);
                    }
                }

                const dxMouse = posArray[i3] - mouse.x;
                const dyMouse = posArray[i3 + 1] - mouse.y;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

                if (distMouse < mouseDistance) {
                    linePositions.push(posArray[i3], posArray[i3 + 1], posArray[i3 + 2]);
                    linePositions.push(mouse.x, mouse.y, 0);
                }
            }

            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            particlesGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
